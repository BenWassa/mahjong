name: Deploy #7 interaction prototype to Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: issue-7-prototype-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build prototype
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install prototype dependencies
        run: npm ci
        working-directory: prototype

      - name: Check and build prototype
        run: npm run check
        working-directory: prototype

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: prototype/dist

  deploy:
    name: Deploy prototype
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
